[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xray-fl"
dynamic = ["version"]
description = "Chest X-ray pneumonia classification: centralized vs. federated learning (FedAvg) in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yinan Sun", email = "scyys25@nottingham.edu.cn" }]
keywords = ["federated-learning", "chest-xray", "pneumonia", "pytorch", "medical-imaging"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
xray-fl = "xray_fl.cli:main"

[project.urls]
Homepage = "https://github.com/isaac-sun/chest-xray-federated-learning"
Repository = "https://github.com/isaac-sun/chest-xray-federated-learning"
Issues = "https://github.com/isaac-sun/chest-xray-federated-learning/issues"

[tool.hatch.version]
path = "src/xray_fl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_fl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
